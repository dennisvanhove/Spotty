<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Spotty</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #111;
      color: #eee;
      padding-bottom: 140px; /* room for the fixed player */
    }
    header {
      padding: 18px 16px 8px;
      font-size: 22px;
      font-weight: 700;
      position: sticky;
      top: 0;
      background: #111;
    }
    #search {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1c1c1c;
      color: #eee;
      margin: 0 0 6px;
    }
    .search-wrap { padding: 0 16px 6px; }
    .add-wrap { display: flex; gap: 8px; padding: 0 16px 6px; }
    #ytUrl {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1c1c1c;
      color: #eee;
    }
    #addBtn {
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #1db954;
      color: #04210f;
      cursor: pointer;
    }
    #addBtn:disabled { opacity: 0.5; cursor: default; }
    #addStatus { padding: 0 16px 8px; font-size: 13px; min-height: 18px; color: #ccc; }

    /* Playlist tabs */
    #tabs {
      display: flex;
      gap: 8px;
      padding: 2px 16px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      font-size: 14px;
      border: 1px solid #333;
      border-radius: 999px;
      background: #1c1c1c;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active { background: #1db954; border-color: #1db954; color: #04210f; font-weight: 600; }
    .tab.newtab { color: #1db954; border-style: dashed; }

    /* Playlist action bar (rename / delete) */
    #playlistBar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 0 16px 10px;
      font-size: 13px;
      color: #aaa;
    }
    #playlistBar .pl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #playlistBar button {
      border: 1px solid #333;
      background: #1c1c1c;
      color: #ccc;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #playlistBar button.danger { color: #e57373; border-color: #5a2a2a; }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      padding: 14px 16px;
      border-bottom: 1px solid #1f1f1f;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    li:active { background: #1d1d1d; }
    li.playing .title { color: #1db954; font-weight: 600; }
    li .idx { color: #666; font-size: 13px; min-width: 26px; }
    li .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .rowbtn {
      flex: 0 0 auto;
      width: 34px; height: 34px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #1db954;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    li .rowbtn.remove { color: #e57373; }
    .empty { padding: 40px 16px; color: #888; text-align: center; }

    /* Add-to-playlist modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .modal-card {
      background: #1c1c1c;
      width: 100%;
      max-height: 70vh;
      border-radius: 16px 16px 0 0;
      padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }
    .modal-head { font-size: 15px; font-weight: 700; padding: 6px 4px 12px; color: #eee; }
    .modal-item {
      display: block; width: 100%; text-align: left;
      padding: 14px 12px;
      border: none; border-bottom: 1px solid #2a2a2a;
      background: none; color: #eee; font-size: 16px; cursor: pointer;
    }
    .modal-item.new { color: #1db954; }
    .modal-empty { padding: 14px 12px; color: #888; }
    .modal-close {
      display: block; width: 100%;
      margin-top: 12px; padding: 14px;
      border: none; border-radius: 10px;
      background: #2a2a2a; color: #eee; font-size: 15px; cursor: pointer;
    }

    #player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #181818;
      border-top: 1px solid #2a2a2a;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    }
    #nowPlaying {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
      color: #ccc;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    .controls button {
      background: none;
      border: none;
      color: #eee;
      font-size: 30px;
      line-height: 1;
      padding: 6px;
      cursor: pointer;
    }
    .controls button:active { opacity: 0.6; }
    #shuffle {
      font-size: 20px;
      opacity: 0.4;
      border-radius: 999px;
      width: 44px;
      height: 44px;
      transition: opacity 0.15s, background 0.15s;
    }
    #shuffle.active {
      opacity: 1;
      background: rgba(29, 185, 84, 0.22);
      box-shadow: 0 0 0 1px rgba(29, 185, 84, 0.5) inset;
    }
    #play { font-size: 40px; }
    #seek { width: 100%; margin: 6px 0 2px; accent-color: #1db954; }
    .time { display: flex; justify-content: space-between; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <header>🎵 Spotty</header>
  <div class="add-wrap">
    <input id="ytUrl" type="url" inputmode="url" placeholder="Paste a YouTube URL to add…" autocomplete="off">
    <button id="addBtn">Add</button>
  </div>
  <div id="addStatus"></div>
  <div id="tabs"></div>
  <div id="playlistBar"></div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
  </div>
  <ul id="list"><li class="empty">Loading…</li></ul>

  <div id="player">
    <div id="nowPlaying">Nothing playing</div>
    <input id="seek" type="range" min="0" max="0" value="0" step="0.1">
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button id="shuffle" title="Shuffle">🔀</button>
      <button id="prev" title="Previous">⏮</button>
      <button id="play" title="Play/Pause">▶️</button>
      <button id="next" title="Next">⏭</button>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <!-- Add-to-playlist sheet -->
  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalTitle" class="modal-head">Add to playlist</div>
      <div id="modalList"></div>
      <button id="modalClose" class="modal-close">Cancel</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const listEl = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const nowPlaying = document.getElementById('nowPlaying');
    const playBtn = document.getElementById('play');
    const seek = document.getElementById('seek');
    const curEl = document.getElementById('cur');
    const durEl = document.getElementById('dur');
    const ytUrl = document.getElementById('ytUrl');
    const addBtn = document.getElementById('addBtn');
    const addStatus = document.getElementById('addStatus');
    const shuffleBtn = document.getElementById('shuffle');
    const tabsEl = document.getElementById('tabs');
    const playlistBar = document.getElementById('playlistBar');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalList = document.getElementById('modalList');
    const modalClose = document.getElementById('modalClose');

    let songs = [];          // all songs: {url, title, path}
    let songByPath = {};      // path -> song
    let playlists = [];       // [{id, name, songs:[path]}]
    let view = 'all';         // 'all' or a playlist id
    let filtered = [];        // song objects currently displayed

    // Playback queue (independent of what's displayed once playback starts).
    let queue = [];           // song objects
    let queuePos = -1;        // index into queue of the playing track
    let currentSong = null;   // the playing song object
    let seeking = false;

    // Shuffle state (operates over `queue`).
    let shuffle = false;
    let shuffleBag = [];      // queue indices left this cycle (no repeats until empty)
    let history = [];         // played queue indices, for prev in shuffle mode

    function fmt(t) {
      if (!isFinite(t) || t < 0) t = 0;
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    // ---- Loading ----
    async function loadSongs() {
      try { songs = await (await fetch('/api/songs')).json(); }
      catch { songs = []; }
      songByPath = {};
      songs.forEach((s) => { songByPath[s.path] = s; });
    }
    async function loadPlaylists() {
      try { playlists = await (await fetch('/api/playlists')).json(); }
      catch { playlists = []; }
    }
    async function loadAll() {
      await Promise.all([loadSongs(), loadPlaylists()]);
      showView();
    }

    // ---- Views ----
    // The songs for the active view (all songs, or a playlist's existing songs in order).
    function currentViewSongs() {
      if (view === 'all') return songs;
      const pl = playlists.find((p) => p.id === view);
      if (!pl) return songs;
      return pl.songs.map((p) => songByPath[p]).filter(Boolean);
    }

    function applyView() {
      const base = currentViewSongs();
      const q = searchEl.value.toLowerCase().trim();
      filtered = q ? base.filter((s) => s.title.toLowerCase().includes(q)) : base;
      render();
    }

    function showView() {
      renderTabs();
      renderPlaylistBar();
      applyView();
    }

    function renderTabs() {
      tabsEl.innerHTML = '';
      const mkTab = (label, active, onclick, cls) => {
        const b = document.createElement('button');
        b.className = 'tab' + (active ? ' active' : '') + (cls ? ' ' + cls : '');
        b.textContent = label;
        b.onclick = onclick;
        return b;
      };
      tabsEl.appendChild(mkTab('All Songs', view === 'all', () => switchView('all')));
      playlists.forEach((p) => {
        tabsEl.appendChild(mkTab(p.name, view === p.id, () => switchView(p.id)));
      });
      tabsEl.appendChild(mkTab('＋ New', false, createPlaylist, 'newtab'));
    }

    function switchView(v) {
      view = v;
      searchEl.value = '';
      showView();
    }

    function renderPlaylistBar() {
      const pl = view !== 'all' && playlists.find((p) => p.id === view);
      if (!pl) { playlistBar.style.display = 'none'; return; }
      playlistBar.style.display = 'flex';
      playlistBar.innerHTML = '';
      const name = document.createElement('span');
      name.className = 'pl-name';
      name.textContent = pl.name + ' · ' + pl.songs.length + (pl.songs.length === 1 ? ' song' : ' songs');
      const rename = document.createElement('button');
      rename.textContent = 'Rename';
      rename.onclick = () => renamePlaylist(pl);
      const del = document.createElement('button');
      del.textContent = 'Delete';
      del.className = 'danger';
      del.onclick = () => deletePlaylist(pl);
      playlistBar.append(name, rename, del);
    }

    function render() {
      if (!filtered.length) {
        const msg = view === 'all'
          ? 'No songs found. Add one with a YouTube URL above.'
          : 'This playlist is empty. Open “All Songs” and tap ＋ to add tracks.';
        listEl.innerHTML = '<li class="empty">' + msg + '</li>';
        return;
      }
      listEl.innerHTML = '';
      filtered.forEach((song, i) => {
        const li = document.createElement('li');
        if (currentSong && song.path === currentSong.path) li.className = 'playing';

        const idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = i + 1;

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = song.title;

        const act = document.createElement('button');
        act.className = 'rowbtn';
        if (view === 'all') {
          act.textContent = '＋';
          act.title = 'Add to playlist';
          act.onclick = (e) => { e.stopPropagation(); openAddToPlaylist(song); };
        } else {
          act.textContent = '✕';
          act.className += ' remove';
          act.title = 'Remove from this playlist';
          act.onclick = (e) => { e.stopPropagation(); removeFromPlaylist(view, song.path); };
        }

        li.append(idx, title, act);
        li.onclick = () => playAt(i);
        listEl.appendChild(li);
      });
    }

    // ---- Playback ----
    function playAt(i) {
      if (i < 0 || i >= filtered.length) return;
      // Lock in the current view as the playback queue.
      queue = filtered.slice();
      queuePos = i;
      shuffleBag = [];
      history = [];
      playSong(queue[queuePos]);
    }

    function playSong(song) {
      if (!song) return;
      currentSong = song;
      audio.src = song.url;
      audio.play().catch(() => {});
      nowPlaying.textContent = song.title;
      document.title = '▶ ' + song.title;
      render();
      updateMediaSession(song);
    }

    // Pull the next queue index from the shuffle bag, refilling/reshuffling when empty.
    function pickShuffleNext() {
      if (!queue.length) return null;
      if (!shuffleBag.length) {
        shuffleBag = queue.map((_, i) => i).filter((i) => i !== queuePos);
        for (let j = shuffleBag.length - 1; j > 0; j--) {
          const k = Math.floor(Math.random() * (j + 1));
          [shuffleBag[j], shuffleBag[k]] = [shuffleBag[k], shuffleBag[j]];
        }
      }
      return shuffleBag.pop();
    }

    function next() {
      if (!queue.length) { if (filtered.length) playAt(0); return; }
      if (shuffle) {
        if (queuePos !== -1) history.push(queuePos);
        const i = pickShuffleNext();
        if (i == null) return;
        queuePos = i;
        playSong(queue[queuePos]);
        return;
      }
      queuePos = (queuePos + 1) % queue.length;
      playSong(queue[queuePos]);
    }

    function prev() {
      if (!queue.length) return;
      // If more than 3s in, restart the current track first (standard player behaviour).
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      if (shuffle) {
        if (!history.length) { audio.currentTime = 0; return; }
        if (queuePos !== -1) shuffleBag.push(queuePos);
        queuePos = history.pop();
        playSong(queue[queuePos]);
        return;
      }
      queuePos = (queuePos - 1 + queue.length) % queue.length;
      playSong(queue[queuePos]);
    }

    function setShuffle(on) {
      shuffle = on;
      shuffleBag = [];
      history = [];
      shuffleBtn.classList.toggle('active', shuffle);
      try { localStorage.setItem('spotty.shuffle', shuffle ? '1' : '0'); } catch {}
    }

    function togglePlay() {
      if (!currentSong) { next(); return; }
      if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    }

    // ---- Playlist actions (API) ----
    async function createPlaylist() {
      const name = (prompt('New playlist name:') || '').trim();
      if (!name) return null;
      try {
        const res = await fetch('/api/playlists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const pl = await res.json();
        if (!res.ok) throw new Error(pl.error || 'Failed to create playlist');
        playlists.push(pl);
        renderTabs();
        return pl;
      } catch (e) { alert('Could not create playlist: ' + e.message); return null; }
    }

    async function savePlaylistSongs(id, songsArr) {
      try {
        const res = await fetch('/api/playlists/' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ songs: songsArr }),
        });
        const pl = await res.json();
        if (!res.ok) throw new Error(pl.error || 'Failed to update playlist');
        const i = playlists.findIndex((p) => p.id === id);
        if (i !== -1) playlists[i] = pl;
        showView();
      } catch (e) { alert('Could not update playlist: ' + e.message); }
    }

    async function addToPlaylist(id, songPath) {
      const pl = playlists.find((p) => p.id === id);
      if (!pl || pl.songs.includes(songPath)) return;
      await savePlaylistSongs(id, pl.songs.concat([songPath]));
    }

    async function removeFromPlaylist(id, songPath) {
      const pl = playlists.find((p) => p.id === id);
      if (!pl) return;
      await savePlaylistSongs(id, pl.songs.filter((p) => p !== songPath));
    }

    async function renamePlaylist(pl) {
      const name = (prompt('Rename playlist:', pl.name) || '').trim();
      if (!name || name === pl.name) return;
      try {
        const res = await fetch('/api/playlists/' + encodeURIComponent(pl.id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const updated = await res.json();
        if (!res.ok) throw new Error(updated.error || 'Failed to rename');
        const i = playlists.findIndex((p) => p.id === pl.id);
        if (i !== -1) playlists[i] = updated;
        showView();
      } catch (e) { alert('Could not rename: ' + e.message); }
    }

    async function deletePlaylist(pl) {
      if (!confirm('Delete playlist “' + pl.name + '”?\n(Your songs and files are NOT deleted.)')) return;
      try {
        const res = await fetch('/api/playlists/' + encodeURIComponent(pl.id), { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete');
        playlists = playlists.filter((p) => p.id !== pl.id);
        if (view === pl.id) view = 'all';
        showView();
      } catch (e) { alert('Could not delete: ' + e.message); }
    }

    // ---- Add-to-playlist modal ----
    function openAddToPlaylist(song) {
      modalTitle.textContent = 'Add “' + song.title + '”';
      modalList.innerHTML = '';
      if (!playlists.length) {
        const p = document.createElement('div');
        p.className = 'modal-empty';
        p.textContent = 'No playlists yet — create one below.';
        modalList.appendChild(p);
      }
      playlists.forEach((pl) => {
        const has = pl.songs.includes(song.path);
        const b = document.createElement('button');
        b.className = 'modal-item';
        b.textContent = (has ? '✓ ' : '') + pl.name;
        b.onclick = async () => { if (!has) await addToPlaylist(pl.id, song.path); closeModal(); };
        modalList.appendChild(b);
      });
      const nb = document.createElement('button');
      nb.className = 'modal-item new';
      nb.textContent = '＋ New playlist…';
      nb.onclick = async () => {
        const pl = await createPlaylist();
        if (pl) await addToPlaylist(pl.id, song.path);
        closeModal();
      };
      modalList.appendChild(nb);
      modal.style.display = 'flex';
    }
    function closeModal() { modal.style.display = 'none'; }
    modalClose.onclick = closeModal;
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // ---- Media Session API: exposes controls to the car / lock screen ----
    function updateMediaSession(song) {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: 'Spotty',
        album: '',
      });
    }
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', next);
      // iOS often refuses to show prev/next TRACK buttons on the lock screen and insists
      // on its own ±10s/15s skip buttons in those two slots. Rather than fight it, we map
      // those skip buttons to track navigation: pressing skip-forward plays the NEXT song
      // and skip-back the PREVIOUS song. (The glyph still shows "10", but it changes songs.)
      // previoustrack/nexttrack above still serve Bluetooth/CarPlay/headphones, which do
      // expose real track buttons.
      try { navigator.mediaSession.setActionHandler('seekbackward', () => prev()); } catch {}
      try { navigator.mediaSession.setActionHandler('seekforward', () => next()); } catch {}
      try { navigator.mediaSession.setActionHandler('seekto', null); } catch {}
    }

    // ---- Audio element wiring ----
    audio.addEventListener('play', () => {
      playBtn.textContent = '⏸';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });
    audio.addEventListener('pause', () => {
      playBtn.textContent = '▶️';
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });
    audio.addEventListener('ended', next);
    audio.addEventListener('loadedmetadata', () => {
      seek.max = audio.duration || 0;
      durEl.textContent = fmt(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (!seeking) seek.value = audio.currentTime;
      curEl.textContent = fmt(audio.currentTime);
      // NOTE: deliberately not calling navigator.mediaSession.setPositionState() here.
      // On iOS, exposing a position/scrubber makes the lock screen show seek (skip)
      // buttons in place of the prev/next track buttons. The in-app seek bar still works.
    });

    seek.addEventListener('input', () => { seeking = true; curEl.textContent = fmt(seek.value); });
    seek.addEventListener('change', () => { audio.currentTime = parseFloat(seek.value); seeking = false; });

    playBtn.onclick = togglePlay;
    document.getElementById('next').onclick = next;
    document.getElementById('prev').onclick = prev;
    shuffleBtn.onclick = () => setShuffle(!shuffle);
    try { setShuffle(localStorage.getItem('spotty.shuffle') === '1'); } catch {}

    searchEl.addEventListener('input', applyView);

    // ---- Add a song from a YouTube URL ----
    async function addFromYouTube() {
      const url = ytUrl.value.trim();
      if (!url) return;
      addBtn.disabled = true;
      ytUrl.disabled = true;
      addStatus.style.color = '#ccc';
      addStatus.textContent = '⏳ Downloading… this can take a few seconds.';
      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Download failed');

        await loadSongs();
        // Re-point the playing track and queue at the refreshed song objects.
        if (currentSong) currentSong = songByPath[currentSong.path] || currentSong;
        queue = queue.map((s) => songByPath[s.path] || s);
        showView();

        ytUrl.value = '';
        addStatus.style.color = '#1db954';
        addStatus.textContent = '✅ Added: ' + data.title;
      } catch (e) {
        addStatus.style.color = '#e57373';
        addStatus.textContent = '⚠️ ' + e.message;
      } finally {
        addBtn.disabled = false;
        ytUrl.disabled = false;
      }
    }
    addBtn.onclick = addFromYouTube;
    ytUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addFromYouTube(); });

    loadAll();
  </script>
</body>
</html>
